<svg viewBox="0 0 1150 860" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>Day 4 clustered web server architecture on AWS</title>
  <desc>A client reaches an Internet Gateway, which routes into a VPC containing an Application Load Balancer security group, which forwards traffic down into two Availability Zones, each with a public subnet holding an EC2 instance behind a security group, all wrapped in an Auto Scaling Group boundary. Every labeled element uses the same icon style: a colored square with a white glyph.</desc>

  <rect x="0" y="0" width="1150" height="860" fill="#FFFFFF"/>

  <defs>
    <marker id="arrowY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>

    <symbol id="ic-cloud" viewBox="0 0 24 24">
      <path d="M6 18a4.5 4.5 0 0 1-1-8.9A5.5 5.5 0 0 1 15.8 7 4 4 0 0 1 18 14.9V15H6z" fill="#fff"/>
    </symbol>
    <symbol id="ic-flag" viewBox="0 0 24 24">
      <path d="M6 3v18" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M6 4h12l-3 4 3 4H6" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-vpc" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="3" stroke="#fff" stroke-width="2" fill="none"/>
      <circle cx="12" cy="12" r="2.2" fill="#fff"/>
      <path d="M12 6.5v3.3M12 14.2v3.3M6.5 12h3.3M14.2 12h3.3" stroke="#fff" stroke-width="1.6"/>
    </symbol>
    <symbol id="ic-lock" viewBox="0 0 24 24">
      <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="6" y="10.5" width="12" height="9" rx="1.5" fill="#fff"/>
    </symbol>
    <symbol id="ic-scale" viewBox="0 0 24 24">
      <path d="M5.5 11A7 7 0 0 1 17 6.3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M16 4.5 L17.3 6.6 L14.9 7.2Z" fill="#fff"/>
      <path d="M18.5 13A7 7 0 0 1 7 17.7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M8 19.5 L6.7 17.4 L9.1 16.8Z" fill="#fff"/>
    </symbol>
    <symbol id="ic-chip" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="1" fill="#fff"/>
      <path d="M9 4v3M12 4v3M15 4v3M9 17v3M12 17v3M15 17v3M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3" stroke="#fff" stroke-width="1.4"/>
    </symbol>
    <symbol id="ic-alb" viewBox="0 0 24 24">
      <circle cx="12" cy="9" r="2.4" fill="#fff"/>
      <circle cx="6" cy="18" r="2.2" fill="#fff"/>
      <circle cx="18" cy="18" r="2.2" fill="#fff"/>
      <path d="M12 11.4 L6 15.8 M12 11.4 L18 15.8" stroke="#fff" stroke-width="1.8"/>
    </symbol>
    <symbol id="ic-gateway" viewBox="0 0 24 24">
      <path d="M4 12h16M12 4v16M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Client -->
  <rect x="35" y="330" width="80" height="52" rx="4" fill="#F5F6F7" stroke="#4A5568" stroke-width="2.5"/>
  <rect x="45" y="339" width="60" height="34" rx="2" fill="#FFFFFF" stroke="#4A5568" stroke-width="1.5"/>
  <circle cx="75" cy="420" r="13" fill="#F5F6F7" stroke="#4A5568" stroke-width="2.5"/>
  <path d="M 56 452 Q 75 428 94 452" fill="#F5F6F7" stroke="#4A5568" stroke-width="2.5"/>
  <text x="75" y="472" text-anchor="middle" font-size="15" fill="#232F3E">Client</text>

  <polyline points="115,355 165,355 165,90 218,90" fill="none" stroke="#4A5568" stroke-width="2.5" marker-start="url(#arrowY)" marker-end="url(#arrowY)"/>

  <!-- Internet Gateway -->
  <circle cx="248" cy="90" r="30" fill="#232F3E"/>
  <use href="#ic-gateway" x="234" y="76" width="28" height="28"/>
  <text x="292" y="96" font-size="15" fill="#232F3E">Internet gateway</text>

  <polyline points="248,120 248,145 635,145 635,190" fill="none" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrowY)"/>

  <!-- AWS Cloud -->
  <rect x="150" y="140" width="970" height="670" rx="6" fill="none" stroke="#232F3E" stroke-width="2.5"/>
  <rect x="168" y="152" width="22" height="22" rx="4" fill="#232F3E"/>
  <use href="#ic-cloud" x="171" y="155" width="16" height="16"/>
  <text x="198" y="168" font-size="15" font-weight="600" fill="#232F3E">AWS Cloud</text>

  <!-- Region -->
  <rect x="175" y="190" width="920" height="600" rx="6" fill="none" stroke="#5A6B87" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="193" y="202" width="20" height="20" rx="4" fill="#5A6B87"/>
  <use href="#ic-flag" x="196" y="205" width="14" height="14"/>
  <text x="222" y="216" font-size="14" fill="#5A6B87">Region — eu-west-1</text>

  <!-- VPC -->
  <rect x="195" y="228" width="880" height="540" rx="8" fill="#FBF8FF" stroke="#8C4FFF" stroke-width="3"/>
  <rect x="213" y="240" width="22" height="22" rx="4" fill="#8C4FFF"/>
  <use href="#ic-vpc" x="216" y="243" width="16" height="16"/>
  <text x="243" y="257" font-size="16" font-weight="700" fill="#8C4FFF">VPC · 10.0.0.0/16</text>
  <text x="213" y="278" font-size="12" fill="#7A5FBF">aws_vpc.main</text>

  <!-- ALB security group -->
  <rect x="225" y="290" width="820" height="135" rx="6" fill="#FDEEEE" stroke="#D13212" stroke-width="2.5"/>
  <rect x="240" y="302" width="20" height="20" rx="4" fill="#D13212"/>
  <use href="#ic-lock" x="243" y="305" width="14" height="14"/>
  <text x="268" y="317" font-size="14" font-weight="700" fill="#D13212">Security group</text>
  <text x="240" y="335" font-size="12" fill="#B33A2E">alb_sg — allows 0.0.0.0/0 on port 80</text>

  <circle cx="635" cy="378" r="26" fill="#8C4FFF"/>
  <use href="#ic-alb" x="621" y="364" width="28" height="28"/>
  <text x="635" y="418" text-anchor="middle" font-size="14" font-weight="600" fill="#232F3E">Application Load Balancer</text>
  <text x="635" y="434" text-anchor="middle" font-size="11.5" fill="#5A6B87">aws_lb.web_alb · listener → asg_tg</text>

  <line x1="415" y1="425" x2="415" y2="527" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrowY)"/>
  <line x1="855" y1="425" x2="855" y2="527" stroke="#4A5568" stroke-width="2.5" marker-end="url(#arrowY)"/>

  <!-- AZ 1 -->
  <rect x="225" y="445" width="380" height="300" rx="6" fill="none" stroke="#1A73E8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="240" y="467" font-size="13.5" fill="#1A73E8">Availability Zone 1 (eu-west-1a)</text>

  <!-- AZ 2 -->
  <rect x="665" y="445" width="380" height="300" rx="6" fill="none" stroke="#1A73E8" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="680" y="467" font-size="13.5" fill="#1A73E8">Availability Zone 2 (eu-west-1b)</text>

  <!-- Public subnet 1 -->
  <rect x="245" y="485" width="340" height="225" rx="6" fill="#E9F7EF" stroke="#2E7D32" stroke-width="2.2"/>
  <rect x="258" y="497" width="20" height="20" rx="4" fill="#2E7D32"/>
  <use href="#ic-lock" x="261" y="500" width="14" height="14"/>
  <text x="286" y="512" font-size="13.5" font-weight="600" fill="#2E7D32">Public subnet 1 · 10.0.1.0/24</text>

  <!-- Public subnet 2 -->
  <rect x="685" y="485" width="340" height="225" rx="6" fill="#E9F7EF" stroke="#2E7D32" stroke-width="2.2"/>
  <rect x="698" y="497" width="20" height="20" rx="4" fill="#2E7D32"/>
  <use href="#ic-lock" x="701" y="500" width="14" height="14"/>
  <text x="726" y="512" font-size="13.5" font-weight="600" fill="#2E7D32">Public subnet 2 · 10.0.2.0/24</text>

  <!-- ASG dashed wrapper -->
  <rect x="255" y="528" width="800" height="160" rx="6" fill="none" stroke="#ED7100" stroke-width="2.8" stroke-dasharray="8 5"/>

  <!-- Instance security group 1 -->
  <rect x="275" y="548" width="280" height="120" rx="6" fill="#FFFFFF" stroke="#D13212" stroke-width="2.2"/>
  <rect x="288" y="559" width="18" height="18" rx="4" fill="#D13212"/>
  <use href="#ic-lock" x="291" y="562" width="12" height="12"/>
  <text x="311" y="573" font-size="13" font-weight="700" fill="#D13212">Security group</text>
  <text x="288" y="588" font-size="11" fill="#B33A2E">instance_sg — only from alb_sg</text>
  <rect x="393" y="600" width="46" height="34" rx="4" fill="#D13212"/>
  <use href="#ic-chip" x="399" y="606" width="34" height="22"/>
  <text x="416" y="654" text-anchor="middle" font-size="12.5" fill="#232F3E">Web Server</text>

  <!-- Instance security group 2 -->
  <rect x="715" y="548" width="280" height="120" rx="6" fill="#FFFFFF" stroke="#D13212" stroke-width="2.2"/>
  <rect x="728" y="559" width="18" height="18" rx="4" fill="#D13212"/>
  <use href="#ic-lock" x="731" y="562" width="12" height="12"/>
  <text x="751" y="573" font-size="13" font-weight="700" fill="#D13212">Security group</text>
  <text x="728" y="588" font-size="11" fill="#B33A2E">instance_sg — only from alb_sg</text>
  <rect x="833" y="600" width="46" height="34" rx="4" fill="#D13212"/>
  <use href="#ic-chip" x="839" y="606" width="34" height="22"/>
  <text x="856" y="654" text-anchor="middle" font-size="12.5" fill="#232F3E">Web Server</text>

  <!-- ASG icon -->
  <circle cx="635" cy="588" r="24" fill="#ED7100"/>
  <use href="#ic-scale" x="621" y="574" width="28" height="28"/>
  <text x="635" y="632" text-anchor="middle" font-size="14" font-weight="700" fill="#ED7100">Auto Scaling group</text>
  <text x="635" y="648" text-anchor="middle" font-size="11" fill="#B35A00">min 2 · max 5 · web_asg</text>

  <!-- Legend -->
  <rect x="175" y="800" width="18" height="18" rx="4" fill="#8C4FFF"/>
  <text x="199" y="814" font-size="12.5" fill="#232F3E">VPC</text>
  <rect x="248" y="800" width="18" height="18" rx="4" fill="#1A73E8"/>
  <text x="272" y="814" font-size="12.5" fill="#232F3E">Availability Zone</text>
  <rect x="392" y="800" width="18" height="18" rx="4" fill="#2E7D32"/>
  <text x="416" y="814" font-size="12.5" fill="#232F3E">Public subnet</text>
  <rect x="527" y="800" width="18" height="18" rx="4" fill="#D13212"/>
  <text x="551" y="814" font-size="12.5" fill="#232F3E">Security group</text>
  <rect x="670" y="800" width="18" height="18" rx="4" fill="#ED7100"/>
  <text x="694" y="814" font-size="12.5" fill="#232F3E">Auto Scaling group</text>
</svg>
